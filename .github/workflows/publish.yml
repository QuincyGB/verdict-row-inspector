name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: verdict-row-inspector
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verdict-row-inspector (Python)
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish verdict-row-inspector
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
